name: Build Auction Arena APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Grok ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Grok ZIP not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Android Gradle project found."
            echo "Files found:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          gradle assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuctionArena-APK
          path: |
            ${{ env.ANDROID_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
